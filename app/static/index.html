<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten druhý</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #1d1b18; --muted: #6e675c;
    --me: #e6dfd0; --him: #fffdf8; --accent: #8b1e1e; --line: #d9d1c0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --panel: #1b1a18; --ink: #ece6da; --muted: #9a917f;
            --me: #2a2723; --him: #1b1a18; --accent: #d0504a; --line: #34302a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 Georgia, "Iowan Old Style", serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
           padding: 14px 16px; border-bottom: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.25rem; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  header small { color: var(--muted); font-style: italic; }
  button { font: inherit; cursor: pointer; }
  #reset { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
           padding: 4px 10px; font-size: .85rem; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word;
         max-width: 88%; border: 1px solid var(--line); }
  .me { background: var(--me); margin-left: auto; font-family: system-ui, sans-serif; font-size: .95rem; }
  .him { background: var(--him); }
  .him::before { content: "Ten druhý"; display: block; font-size: .75rem; color: var(--accent);
                 font-family: system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
  .src { display: block; margin-top: 6px; font-size: .75rem; color: var(--muted); font-family: system-ui, sans-serif; }
  .err { color: var(--accent); font-style: italic; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         border-top: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; font: 16px/1.4 system-ui, sans-serif; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-height: 30vh; }
  #send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <div><h1>Ten<span>,</span> druhý</h1><small>hlas, co ti radí, i když nechceš</small></div>
  <button id="reset" title="Smazat historii a začít znovu">nová konverzace</button>
</header>
<div id="log"><p class="empty">No? Tak co chceš?</p></div>
<form id="f">
  <textarea id="q" rows="1" placeholder="Napiš mu něco…" autofocus></textarea>
  <button id="send" type="submit">Poslat</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'),
      send = document.getElementById('send'), form = document.getElementById('f');

function newId() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/-/g, ''); }
let sid;
try { sid = localStorage.getItem('td_sid'); } catch (e) {}
if (!sid) { sid = newId(); try { localStorage.setItem('td_sid', sid); } catch (e) {} }

function bubble(cls, text) {
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text || '';
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

document.getElementById('reset').onclick = async () => {
  await fetch('api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sid }) });
  sid = newId(); try { localStorage.setItem('td_sid', sid); } catch (e) {}
  log.innerHTML = '<p class="empty">Zase od začátku. Fajn.</p>';
};

form.onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text || send.disabled) return;
  q.value = ''; q.style.height = 'auto'; send.disabled = true;
  bubble('me', text);
  const him = bubble('him', '…'); let got = '';
  try {
    const r = await fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ session_id: sid, message: text }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.t) { got += ev.t; him.textContent = got; log.scrollTop = log.scrollHeight; }
        if (ev.error) { const s = document.createElement('span'); s.className = 'err'; s.textContent = (got ? '\n' : '') + ev.error;
                        if (!got) him.textContent = ''; him.appendChild(s); }
        if (ev.done && ev.sources && ev.sources.length) { const s = document.createElement('span'); s.className = 'src';
                        s.textContent = 'vzpomínky z: ' + ev.sources.join(', '); him.appendChild(s); }
      }
    }
  } catch (err) {
    him.textContent = ''; const s = document.createElement('span'); s.className = 'err'; s.textContent = 'Spojení selhalo: ' + err.message; him.appendChild(s);
  }
  send.disabled = false; q.focus();
};
</script>
</body>
</html>
