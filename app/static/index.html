<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten druhý</title>
<!-- use-credentials: the manifest fetch must carry the Authelia session cookie -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ten druhý">
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #1d1b18; --muted: #6e675c;
    --me: #e6dfd0; --him: #fffdf8; --accent: #8b1e1e; --line: #d9d1c0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --panel: #1b1a18; --ink: #ece6da; --muted: #9a917f;
            --me: #2a2723; --him: #1b1a18; --accent: #d0504a; --line: #34302a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { height: 100dvh; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 Georgia, "Iowan Old Style", serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
           padding: 14px 16px; border-bottom: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.25rem; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  header small { color: var(--muted); font-style: italic; }
  button { font: inherit; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word;
         max-width: 88%; border: 1px solid var(--line); }
  .me { background: var(--me); margin-left: auto; font-family: system-ui, sans-serif; font-size: .95rem; }
  .him { background: var(--him); }
  .him::before { content: "Ten druhý"; display: block; font-size: .75rem; color: var(--accent);
                 font-family: system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
  .src { display: block; margin-top: 6px; font-size: .75rem; color: var(--muted); font-family: system-ui, sans-serif; }
  .src a { color: var(--muted); }
  .err { color: var(--accent); font-style: italic; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         border-top: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; font: 16px/1.4 system-ui, sans-serif; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-height: 30vh; }
  #send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; }
  #send:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 6px; }
  .hbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
          padding: 4px 10px; font-size: .85rem; }
  #drawer { position: fixed; inset: 0; display: none; z-index: 10; }
  #drawer.open { display: block; }
  #drawer .shade { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  #drawer .panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--bg);
                   border-left: 1px solid var(--line); display: flex; flex-direction: column;
                   padding-top: env(safe-area-inset-top); }
  #drawer h2 { margin: 0; padding: 14px 16px; font-size: 1rem; border-bottom: 1px solid var(--line);
               display: flex; justify-content: space-between; align-items: center; }
  #convs { overflow-y: auto; flex: 1; padding: 6px 0; }
  .conv { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .conv:hover, .conv.cur { background: var(--me); }
  .conv .t { flex: 1; min-width: 0; }
  .conv .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .t small { color: var(--muted); font-family: system-ui, sans-serif; font-size: .75rem; }
  .conv .del { background: none; border: 0; color: var(--muted); font-size: .8rem; padding: 4px 6px; border-radius: 6px;
               font-family: system-ui, sans-serif; }
  .conv .del.arm { color: #fff; background: var(--accent); }
  #cam { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 10px;
         width: 46px; font-size: 1.1rem; }
  #pick { display: none; }
  #preview { display: none; max-width: 760px; width: 100%; margin: 0 auto; padding: 8px 16px 0; }
  #preview.on { display: flex; align-items: center; gap: 10px; }
  #preview img { height: 64px; border-radius: 8px; border: 1px solid var(--line); }
  #preview button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 2px 8px; }
  .msg img { display: block; max-width: 100%; max-height: 320px; border-radius: 8px; margin-bottom: 6px; }
  #mic { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 10px;
         width: 46px; font-size: 1.1rem; display: none; }
  #mic.on { background: var(--accent); color: #fff; border-color: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  #tts.on { color: var(--ink); border-color: var(--ink); }
  #drawer.wide .panel { width: min(600px, 100%); }
  #drawer.xwide .panel { width: min(860px, 100%); }
  .mhead { position: sticky; top: 0; background: var(--bg); z-index: 1; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .tabs, .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button, .chips button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px;
                                 padding: 3px 10px; font: .8rem system-ui, sans-serif; }
  .tabs button.on, .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { padding: 10px 16px 4px; }
  .msearch { width: 100%; margin-top: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
             background: var(--panel); color: var(--ink); font: .9rem system-ui, sans-serif; }
  .mbody { padding-bottom: 24px; }
  .mbody .msearch { width: calc(100% - 32px); margin: 12px 16px; }
  .hint { color: var(--muted); font: .85rem system-ui, sans-serif; padding: 8px 16px 0; margin: 0; }
  .mprofile, .fedit { width: calc(100% - 32px); margin: 8px 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
                      background: var(--panel); color: var(--ink); font: .95rem/1.5 Georgia, serif; }
  .mbody > .hbtn { margin: 0 16px; }
  .mrow { padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .mrow.small { font-size: .85rem; }
  .mrow small, .mfact small, .card small { color: var(--muted); font-family: system-ui, sans-serif; font-size: .75rem; }
  .mrow.undone { opacity: .45; text-decoration: line-through; }
  .mfact { display: flex; gap: 8px; align-items: flex-start; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .mfact .t { flex: 1; min-width: 0; }
  .mfact.inf .ftext { font-style: italic; }
  .facts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .facts .del { font-size: .85rem; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; color: var(--muted); }
  .facts .del.arm { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mrow .del { margin-left: 8px; background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  .hbtn.on { border-color: var(--accent); color: var(--accent); }
  .card { margin: 10px 16px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .card p { margin: 6px 0 0; }
  h3.sec { margin: 0; padding: 14px 16px 4px; font: 600 .75rem system-ui, sans-serif; letter-spacing: .06em;
           text-transform: uppercase; color: var(--accent); }
  .hbtn { min-width: 34px; }
  .share { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--line);
           font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); cursor: pointer; }
  .share input { margin-top: 2px; accent-color: var(--accent); }
  .tone { align-items: center; flex-wrap: wrap; cursor: default; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 4px 10px; font-size: .8rem; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  .fam { color: var(--accent); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
  @media (max-width: 520px) { header small { display: none; } .hbtn { padding: 4px 6px; min-width: 30px; } }
  .mem { display: block; margin-top: 6px; font: .75rem system-ui, sans-serif; color: var(--muted); font-style: italic; }
  .voice { display: block; margin-top: 6px; font: .75rem system-ui, sans-serif; color: var(--muted); }
  .voice.play { color: var(--accent); cursor: pointer; }
  .voice i { font-style: normal; animation: blink 1.2s infinite; }
  .voice i:nth-child(2) { animation-delay: .2s; } .voice i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .rate { display: flex; gap: 2px; margin: -8px 0 14px 4px; }
  .rate button { background: none; border: 0; padding: 2px 6px; font-size: .85rem; opacity: .35; filter: grayscale(1);
                 border-radius: 6px; }
  .rate button:hover { opacity: .8; }
  .rate button.on { opacity: 1; filter: none; }
  /* installed PWA on notched phones */
  header { padding-top: calc(14px + env(safe-area-inset-top)); }
</style>
</head>
<body>
<header>
  <div><h1>Ten<span>,</span> druhý</h1><small>hlas, co ti radí, i když nechceš</small></div>
  <div class="actions">
    <button id="tts" class="hbtn" title="Číst odpovědi nahlas">🔈</button>
    <button id="mem" class="hbtn" title="Paměť – co o tobě vím, sny, připomínky">🧠</button>
    <button id="hist" class="hbtn" title="Předchozí konverzace">🕘</button>
    <button id="cfg" class="hbtn" title="Nastavení">⚙</button>
    <button id="reset" class="hbtn" title="Nová konverzace (stará zůstane uložená)">✚</button>
  </div>
</header>
<div id="drawer" aria-hidden="true">
  <div class="shade"></div>
  <div class="panel">
    <h2><span id="dtitle">Na co jsme už mysleli</span> <button id="close" class="hbtn" title="Zavřít">✕</button></h2>
    <div id="convs"></div>
  </div>
</div>
<div id="log"><p class="empty">No? Tak co chceš?</p></div>
<div id="preview"><img alt=""><button type="button" id="unpick" title="Odebrat fotku">✕</button></div>
<form id="f">
  <button id="cam" type="button" title="Poslat fotku">📷</button>
  <input id="pick" type="file" accept="image/*">
  <button id="mic" type="button" title="Mluvit (podrž si myšlenky)">🎙</button>
  <textarea id="q" rows="1" placeholder="Napiš mu něco…" autofocus></textarea>
  <button id="send" type="submit">Poslat</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'),
      send = document.getElementById('send'), form = document.getElementById('f');

// Conversations live on the server per Authelia user, so the same chat shows up on every device.
let cid = new URLSearchParams(location.search).get('c');  // set when opened from a check-in notification
if (cid) history.replaceState(null, '', location.pathname);

function bubble(cls, text, imgSrc) {
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  if (imgSrc) { const im = document.createElement('img'); im.src = imgSrc; im.alt = 'fotka'; im.onload = () => { log.scrollTop = log.scrollHeight; }; d.appendChild(im); }
  if (text) d.appendChild(document.createTextNode(text));
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

// 👍/👎 under each of his replies; logged server-side for persona tuning.
function addRating(el, id, rating) {
  if (!id) return;
  const bar = document.createElement('div'); bar.className = 'rate';
  for (const [val, label, title] of [[1, '👍', 'Tohle sedí'], [-1, '👎', 'Tohle by Ten druhý neřekl']]) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.title = title;
    if (rating === val) b.classList.add('on');
    b.onclick = async () => {
      const next = b.classList.contains('on') ? 0 : val;
      bar.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      if (next) b.classList.add('on');
      fetch('api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ message_id: id, rating: next }) }).catch(() => {});
    };
    bar.appendChild(b);
  }
  const say = document.createElement('button'); say.type = 'button'; say.textContent = '🔊'; say.title = 'Přečíst nahlas';
  say.onclick = () => { unlockAudio(); speak(el.dataset.text || '', el); };
  bar.appendChild(say);
  el.after(bar);
}

async function loadState() {
  try {
    const r = await fetch('api/state' + (cid ? '?conversation_id=' + encodeURIComponent(cid) : ''));
    if (!r.ok) return;
    const st = await r.json();
    cid = st.conversation_id;
    if (st.messages.length) {
      log.innerHTML = '';
      for (const m of st.messages) {
        const el = bubble(m.role === 'user' ? 'me' : 'him', m.content, m.image ? 'api/images/' + m.image : null);
        if (m.role === 'assistant') { el.dataset.text = m.content; addRating(el, m.id, m.rating); }
      }
    }
  } catch (e) {}
}
loadState();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

const drawer = document.getElementById('drawer'), convs = document.getElementById('convs');

function when(ts) {
  const d = new Date(ts.replace(' ', 'T') + 'Z'), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}

const dtitle = document.getElementById('dtitle');

function twoStep(btn, label, onConfirm) {
  btn.className = 'del'; btn.type = 'button'; btn.textContent = label;
  btn.onclick = async ev => {
    ev.stopPropagation();
    if (!btn.classList.contains('arm')) { btn.classList.add('arm'); btn.textContent = 'fakt?'; return; }
    await onConfirm();
  };
}

// ---- Proactive check-ins (Web Push) ----
function b64ToBytes(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

// Secret iCal URL: write-only from here (never shown back), the server only reports status.
function calendarRow(cal) {
  const row = document.createElement('div'); row.className = 'share tone';
  const label = document.createElement('span');
  const info = document.createElement('small');
  const render = c => {
    row.innerHTML = ''; label.textContent = '📅 Kalendář: ';
    if (c.connected) {
      info.textContent = c.error ? 'propojený, ale nejde načíst (' + c.error + ')' : 'propojený ✓ (' + c.next7 + ' událostí v příštích 7 dnech)';
      const off = document.createElement('button'); off.className = 'hbtn'; off.type = 'button'; off.textContent = 'odpojit';
      off.onclick = () => save('');
      row.append(label, info, off);
    } else {
      const inp = document.createElement('input'); inp.type = 'password'; inp.placeholder = 'tajná adresa ve formátu iCal (https://calendar.google.com/…)';
      inp.autocomplete = 'off'; inp.style.cssText = 'flex:1;min-width:180px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)';
      const ok = document.createElement('button'); ok.className = 'hbtn'; ok.type = 'button'; ok.textContent = 'propojit';
      ok.onclick = () => inp.value.trim() && save(inp.value.trim());
      info.textContent = c.msg || '';
      row.append(label, inp, ok, info);
    }
  };
  const save = async v => {
    const r = await fetch('api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ical_url: v }) });
    const d = await r.json().catch(() => ({}));
    render(r.ok ? d.calendar : { connected: false, msg: d.detail || 'nepovedlo se' });
  };
  render(cal); return row;
}

// API keys for /v1 (Home Assistant, n8n, scripts). The token is shown once, right after creating it.
async function keysRow() {
  const box = document.createElement('div'); box.className = 'share'; box.style.cssText = 'flex-direction:column;cursor:default';
  let keys = [];
  try { keys = await (await fetch('api/keys')).json(); } catch (e) {}
  const api = location.origin + '/v1';
  const head = document.createElement('div'); head.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  const url = document.createElement('code'); url.textContent = api; url.style.color = 'var(--ink)';
  const cp = document.createElement('button'); cp.className = 'hbtn'; cp.type = 'button'; cp.textContent = 'kopírovat';
  cp.onclick = () => navigator.clipboard && navigator.clipboard.writeText(api).then(() => { cp.textContent = 'zkopírováno'; });
  head.append('Adresa (OpenAI-kompatibilní):', url, cp);
  const hint = document.createElement('small');
  hint.textContent = 'Model „ten-druhy“, hlavička Authorization: Bearer <klíč>. Klíč patří tobě – platí tvoje paměť, kalendář a připomínky.';
  box.append(head, hint);
  for (const k of keys) {
    const r = document.createElement('div'); r.style.cssText = 'display:flex;gap:8px;align-items:center';
    const t = document.createElement('span'); t.style.flex = '1';
    t.textContent = k.name + ' · ' + (k.last_used ? 'naposledy ' + when(k.last_used) : 'zatím nepoužitý');
    const del = document.createElement('button');
    twoStep(del, 'zrušit', async () => { await fetch('api/keys/' + k.id, { method: 'DELETE' }).catch(() => {}); r.remove(); });
    r.append(t, del); box.appendChild(r);
  }
  const add = document.createElement('div'); add.style.cssText = 'display:flex;gap:8px';
  const inp = document.createElement('input'); inp.placeholder = 'název (např. Home Assistant)';
  inp.style.cssText = 'flex:1;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)';
  const btn = document.createElement('button'); btn.className = 'hbtn'; btn.type = 'button'; btn.textContent = 'vytvořit';
  const out = document.createElement('code'); out.style.cssText = 'word-break:break-all;color:var(--ink)';
  btn.onclick = async () => {
    if (!inp.value.trim()) return;
    const r = await fetch('api/keys', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: inp.value.trim() }) });
    const d = await r.json().catch(() => ({}));
    if (d.token) { out.textContent = d.token + '  ← zkopíruj si ho teď, víc ho neuvidíš'; inp.value = ''; }
  };
  add.append(inp, btn); box.append(add, out);
  return box;
}

const TONES = [['full', 'naplno'], ['mild', 'mírně'], ['kid', 'pro děti']];
function tonePicker(current, locked) {
  const row = document.createElement('div'); row.className = 'share tone';
  const label = document.createElement('span'); label.textContent = 'Jak se mnou mluvit:';
  row.appendChild(label);
  if (locked) {
    const t = document.createElement('b'); t.textContent = (TONES.find(x => x[0] === current) || [, current])[1] + ' (nastavil správce)';
    row.appendChild(t); return row;
  }
  const seg = document.createElement('div'); seg.className = 'seg';
  for (const [val, name] of TONES) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = name;
    if (val === (current || 'full')) b.classList.add('on');
    b.onclick = async () => {
      const r = await fetch('api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                              body: JSON.stringify({ tone: val }) }).catch(() => null);
      if (r && r.ok) { seg.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); }
    };
    seg.appendChild(b);
  }
  row.appendChild(seg); return row;
}

async function pushToggle() {
  const row = document.createElement('label'); row.className = 'share';
  const cb = document.createElement('input'); cb.type = 'checkbox';
  const txt = document.createElement('span');
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if (!supported) {
    cb.disabled = true;
    txt.textContent = 'Ozývání se samo od sebe: tenhle prohlížeč neumí upozornění. (Na iPhonu jen v aplikaci přidané na plochu.)';
    row.append(cb, txt); return row;
  }
  const reg = await navigator.serviceWorker.ready;
  const current = await reg.pushManager.getSubscription();
  cb.checked = !!current && Notification.permission === 'granted';
  txt.textContent = 'Ozývej se sám – občas ti napíšu, když se něco děje (deploy, narozeniny…). Max jednou denně, 9–21 h.';
  cb.onchange = async () => {
    try {
      if (cb.checked) {
        if (await Notification.requestPermission() !== 'granted') { cb.checked = false; return; }
        const { key } = await (await fetch('api/push/key')).json();
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
        await fetch('api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ subscription: sub.toJSON() }) });
        fetch('api/push/test', { method: 'POST' }).catch(() => {});
      } else {
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          await fetch('api/push/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify({ endpoint: sub.endpoint }) });
          await sub.unsubscribe();
        }
      }
    } catch (e) { cb.checked = false; txt.textContent = 'Nepovedlo se zapnout upozornění: ' + e.message; }
  };
  row.append(cb, txt); return row;
}

// ---- Memory screen (design: docs/MEMORY.md) ----
const OPS = { add: '+ přidáno', update: '✎ upraveno', reinforce: '↑ posíleno', merge: '⇄ sloučeno', merged_away: '⇄ sloučeno do jiného',
              archive: '↧ archivováno', decay: '↧ vybledlo', forget: '− zapomenuto', edit: '✎ ručně', confirm: '✓ potvrzeno',
              reject: '✗ odmítnuto' };
const KIND = { fact: '', inference: 'odhad', event: 'událost', preference: 'preference', routine: 'zvyk', goal: 'cíl', self: 'jeho' };
let memTab = 'fakta', memCat = 'vše';

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v != null) e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const api = (url, method = 'GET', body) => fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {},
                                                         body: body ? JSON.stringify(body) : undefined }).then(r => r.json());
const dots = c => '●'.repeat(Math.round(c * 5)) + '○'.repeat(5 - Math.round(c * 5));

async function openMemory(tab) {

  let o;
  try { o = await api('api/memory/overview'); } catch (e) { convs.innerHTML = '<p class="empty">Nejde načíst.</p>'; return; }
  convs.innerHTML = '';
  const tabs = el('div', { class: 'tabs' });
  for (const [k, label] of [['profil', 'Profil'], ['fakta', 'Fakta'], ['lide', 'Lidé'], ['kronika', 'Kronika'], ['sny', 'Sny'],
                            ['noc', 'Noc'], ['smycky', 'Smyčky']])
    tabs.append(el('button', { type: 'button', class: k === memTab ? 'on' : '', onclick: () => openMemory(k) }, label));
  const search = el('input', { class: 'msearch', placeholder: '🔍 hledat v paměti…' });
  search.onkeydown = e => { if (e.key === 'Enter' && search.value.trim()) memSearch(search.value.trim(), body); };
  const body = el('div', { class: 'mbody' });
  convs.append(el('div', { class: 'mhead' }, tabs, search), body);
  ({ profil: memProfile, fakta: memFacts, lide: memPeople, kronika: memChronicle, sny: memDreams, noc: memNight,
     smycky: memLoops })[memTab](o, body);
}

function memProfile(o, body) {

function factRow(f, refresh) {
  const kind = KIND[f.kind] ? el('span', { class: 'fam' }, KIND[f.kind]) : null;
  const meta = el('small', {}, `${f.category} · ${dots(f.confidence)} · ${f.evidence}×` + (f.valid_until ? ' · ' + f.valid_until : '')
                                + (f.own ? '' : ' · od ' + f.user));
  const text = el('span', { class: 'ftext' }, f.text);
  const row = el('div', { class: 'mfact' + (f.kind === 'inference' ? ' inf' : '') }, el('div', { class: 't' }, kind, text, el('br'), meta));
  if (!f.own) return row;
  const acts = el('div', { class: 'facts' });
  if (f.kind === 'inference') {
    acts.append(el('button', { class: 'hbtn', type: 'button', title: 'Je to pravda',
                               onclick: async () => { await api(`api/memory/facts/${f.id}/confirm`, 'POST'); refresh(); } }, '✓ pravda'),
                el('button', { class: 'hbtn', type: 'button', title: 'Nesmysl – už to neodvozuj',
                               onclick: async () => { await api(`api/memory/facts/${f.id}/reject`, 'POST'); row.remove(); } }, '✗ nesmysl'));
  }
  acts.append(
    el('button', { class: 'hbtn' + (f.pinned ? ' on' : ''), type: 'button', title: f.pinned ? 'Připíchnuté – nikdy nezapomenu' : 'Připíchnout (nikdy nezapomenout)',
                   onclick: async () => { await api(`api/memory/facts/${f.id}`, 'PATCH', { pinned: !f.pinned }); refresh(); } }, '📌'),
    el('button', { class: 'hbtn', type: 'button', title: 'Upravit', onclick: () => {

      text.replaceWith(el('span', {}, inp, ok)); } }, '✎'));

function resize(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Tohle není obrázek.')); };
    im.src = url;
  });
}
pick.onchange = async () => {
  const f = pick.files && pick.files[0]; if (!f) return;
  try { photo = await resize(f); preview.querySelector('img').src = photo; preview.classList.add('on'); q.focus(); }
  catch (e) { photo = null; preview.classList.remove('on'); }
};

// ---- Voice (browser-only: Web Speech API, no extra API quota) ----
const synth = window.speechSynthesis;
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const ttsBtn = document.getElementById('tts'), mic = document.getElementById('mic');
let ttsOn = false, dictated = false, voice = null;
try { ttsOn = localStorage.getItem('td_tts') === '1'; } catch (e) {}

function pickVoice() {
  if (!synth) return;
  const cs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('cs'));
  // Prefer a male-ish / higher quality Czech voice when the platform has several.
  voice = cs.find(v => /premium|enhanced|natural/i.test(v.name)) || cs.find(v => /google/i.test(v.name)) || cs[0] || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

function renderTts() { ttsBtn.textContent = ttsOn ? '🔊' : '🔈'; ttsBtn.classList.toggle('on', ttsOn); }
renderTts();
ttsBtn.onclick = () => {
  ttsOn = !ttsOn; renderTts();
  try { localStorage.setItem('td_tts', ttsOn ? '1' : '0'); } catch (e) {}
  if (!ttsOn) stopSpeaking();
};

// One reusable <audio>: iOS only lets it play later if it was started inside a tap (see unlockAudio).
const player = new Audio();
const SILENCE = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
let speakSeq = 0;

function unlockAudio() { player.src = SILENCE; player.play().catch(() => {}); }

// Status line inside the reply bubble: "chystám hlas…" while TTS generates, "mluví · zastavit" while playing.
let voiceTag = null;
function setVoiceTag(el, state) {
  if (!voiceTag && el && state) { voiceTag = document.createElement('span'); voiceTag.className = 'voice'; el.appendChild(voiceTag); }
  if (!voiceTag) return;
  if (!state) { voiceTag.remove(); voiceTag = null; return; }
  voiceTag.className = 'voice ' + state;
  voiceTag.innerHTML = state === 'gen' ? '🔊 chystám hlas<i>.</i><i>.</i><i>.</i>' : '🔊 mluví · <u>zastavit</u>';
  voiceTag.onclick = state === 'play' ? stopSpeaking : null;
}

function stopSpeaking() {
  speakSeq++; player.pause();
  if (synth) synth.cancel();
  setVoiceTag(null, null);
}

function browserSpeak(text, seq) {
  if (!synth) { setVoiceTag(null, null); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'cs-CZ'; if (voice) u.voice = voice;
  u.rate = 1.05; u.pitch = 0.8;  // a bit lower and drier
  u.onend = u.onerror = () => { if (seq === speakSeq) setVoiceTag(null, null); };
  setVoiceTag(null, 'play');
  synth.speak(u);
}

// His real voice (Gemini TTS, ~5 s to generate); browser voice if the server can't (quota, offline).
async function speak(text, el) {
  if (!text) return;
  stopSpeaking(); const seq = speakSeq;
  setVoiceTag(el, 'gen');
  try {
    const r = await fetch('api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error('tts ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    if (seq !== speakSeq) { URL.revokeObjectURL(url); return; }  // user moved on meanwhile
    player.src = url;
    player.onended = () => { URL.revokeObjectURL(url); if (seq === speakSeq) setVoiceTag(null, null); };
    await player.play();
    if (seq === speakSeq) setVoiceTag(null, 'play');
  } catch (e) {
    if (seq === speakSeq) browserSpeak(text, seq);
  }
}

if (Recognition) {
  mic.style.display = 'block';
  let rec = null, finalText = '';
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }  // second tap: stop and send
    stopSpeaking();
    rec = new Recognition();
    rec.lang = 'cs-CZ'; rec.interimResults = true; rec.continuous = false;
    finalText = ''; mic.classList.add('on'); q.placeholder = 'Poslouchám…';
    rec.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript; else interim += ev.results[i][0].transcript;
      }
      q.value = (finalText + interim).trim(); q.dispatchEvent(new Event('input'));
    };
    rec.onerror = ev => { if (ev.error === 'not-allowed') q.placeholder = 'Mikrofon je zakázaný.'; };
    rec.onend = () => {
      rec = null; mic.classList.remove('on'); q.placeholder = 'Napiš mu něco…';
      if (q.value.trim()) { dictated = true; form.requestSubmit(); }
    };
    rec.start();
  };
}

// Memory is extracted in the background a few seconds after a reply; show what got saved.
let memMark = 0;
function watchMemory(el, conv, mark) {
  let shown = new Set();
  const check = async () => {
    try {
      const items = await (await fetch('api/memories/new?conversation_id=' + encodeURIComponent(conv) + '&after=' + mark)).json();
      const fresh = items.filter(m => !shown.has(m.id));
      if (!fresh.length) return;
      fresh.forEach(m => shown.add(m.id));
      let tag = el.querySelector('.mem');
      if (!tag) { tag = document.createElement('span'); tag.className = 'mem'; tag.title = 'Otevřít paměť'; tag.style.cursor = 'pointer';
                  tag.onclick = () => openMemory('profil'); el.appendChild(tag); }
      tag.textContent = '🧠 všiml jsem si: ' + [...shown].map(id => items.find(m => m.id === id)?.text).filter(Boolean).join(' · ');
    } catch (e) {}
  };
  [4000, 10000, 20000].forEach(ms => setTimeout(check, ms));  // extraction takes longer when models fall back
}

form.onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if ((!text && !photo) || send.disabled) return;
  const img = photo; photo = null; preview.classList.remove('on'); pick.value = '';
  // Spoken question -> spoken answer, even with the speaker toggle off.
  const speakReply = ttsOn || dictated; dictated = false;
  stopSpeaking();
  if (speakReply) { unlockAudio(); if (synth) synth.speak(new SpeechSynthesisUtterance('')); }  // iOS: unlock audio within the tap
  q.value = ''; q.style.height = 'auto'; send.disabled = true;
  bubble('me', text, img);
  const him = bubble('him', '…'); let got = '';
  try {
    const r = await fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ conversation_id: cid, message: text, image: img }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.conversation_id) { cid = ev.conversation_id; memMark = ev.memory_mark || 0; }
        if (ev.t) { got += ev.t; him.textContent = got; log.scrollTop = log.scrollHeight; }
        if (ev.error) { const s = document.createElement('span'); s.className = 'err'; s.textContent = (got ? '\n' : '') + ev.error;
                        if (!got) him.textContent = ''; him.appendChild(s); }
        if (ev.done && ev.sources && ev.sources.length) { const s = document.createElement('span'); s.className = 'src';
                        s.textContent = 'vzpomínky z: ' + ev.sources.join(', '); him.appendChild(s); }
        if (ev.done && ev.links && ev.links.length) {
          const s = document.createElement('span'); s.className = 'src'; s.append('z webu: ');
          ev.links.forEach((l, i) => {
            const a = document.createElement('a'); a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
            a.textContent = l.title.length > 40 ? l.title.slice(0, 40) + '…' : l.title;
            if (i) s.append(' · '); s.appendChild(a);
          });
          him.appendChild(s);
        }
        if (ev.done) { him.dataset.text = got; addRating(him, ev.message_id, null); watchMemory(him, cid, memMark); if (speakReply) speak(got, him); }
      }
    }
  } catch (err) {
    him.textContent = ''; const s = document.createElement('span'); s.className = 'err'; s.textContent = 'Spojení selhalo: ' + err.message; him.appendChild(s);
  }
  send.disabled = false; q.focus();
};
</script>
