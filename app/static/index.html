<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten druhý</title>
<!-- use-credentials: the manifest fetch must carry the Authelia session cookie -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ten druhý">
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #1d1b18; --muted: #6e675c;
    --me: #e6dfd0; --him: #fffdf8; --accent: #8b1e1e; --line: #d9d1c0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --panel: #1b1a18; --ink: #ece6da; --muted: #9a917f;
            --me: #2a2723; --him: #1b1a18; --accent: #d0504a; --line: #34302a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { height: 100dvh; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 Georgia, "Iowan Old Style", serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
           padding: 14px 16px; border-bottom: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.25rem; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  header small { color: var(--muted); font-style: italic; }
  button { font: inherit; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word;
         max-width: 88%; border: 1px solid var(--line); }
  .me { background: var(--me); margin-left: auto; font-family: system-ui, sans-serif; font-size: .95rem; }
  .him { background: var(--him); }
  .him::before { content: "Ten druhý"; display: block; font-size: .75rem; color: var(--accent);
                 font-family: system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
  .src { display: block; margin-top: 6px; font-size: .75rem; color: var(--muted); font-family: system-ui, sans-serif; }
  .err { color: var(--accent); font-style: italic; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         border-top: 1px solid var(--line); max-width: 760px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; font: 16px/1.4 system-ui, sans-serif; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-height: 30vh; }
  #send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; }
  #send:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 6px; }
  .hbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
          padding: 4px 10px; font-size: .85rem; }
  #drawer { position: fixed; inset: 0; display: none; z-index: 10; }
  #drawer.open { display: block; }
  #drawer .shade { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  #drawer .panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--bg);
                   border-left: 1px solid var(--line); display: flex; flex-direction: column;
                   padding-top: env(safe-area-inset-top); }
  #drawer h2 { margin: 0; padding: 14px 16px; font-size: 1rem; border-bottom: 1px solid var(--line);
               display: flex; justify-content: space-between; align-items: center; }
  #convs { overflow-y: auto; flex: 1; padding: 6px 0; }
  .conv { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .conv:hover, .conv.cur { background: var(--me); }
  .conv .t { flex: 1; min-width: 0; }
  .conv .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .t small { color: var(--muted); font-family: system-ui, sans-serif; font-size: .75rem; }
  .conv .del { background: none; border: 0; color: var(--muted); font-size: .8rem; padding: 4px 6px; border-radius: 6px;
               font-family: system-ui, sans-serif; }
  .conv .del.arm { color: #fff; background: var(--accent); }
  #mic { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 10px;
         width: 46px; font-size: 1.1rem; display: none; }
  #mic.on { background: var(--accent); color: #fff; border-color: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  #tts.on { color: var(--ink); border-color: var(--ink); }
  .rate { display: flex; gap: 2px; margin: -8px 0 14px 4px; }
  .rate button { background: none; border: 0; padding: 2px 6px; font-size: .85rem; opacity: .35; filter: grayscale(1);
                 border-radius: 6px; }
  .rate button:hover { opacity: .8; }
  .rate button.on { opacity: 1; filter: none; }
  /* installed PWA on notched phones */
  header { padding-top: calc(14px + env(safe-area-inset-top)); }
</style>
</head>
<body>
<header>
  <div><h1>Ten<span>,</span> druhý</h1><small>hlas, co ti radí, i když nechceš</small></div>
  <div class="actions">
    <button id="tts" class="hbtn" title="Číst odpovědi nahlas">🔈</button>
    <button id="hist" class="hbtn" title="Předchozí konverzace">historie</button>
    <button id="reset" class="hbtn" title="Začít novou konverzaci (stará zůstane uložená)">nová</button>
  </div>
</header>
<div id="drawer" aria-hidden="true">
  <div class="shade"></div>
  <div class="panel">
    <h2>Na co jsme už mysleli <button id="close" class="hbtn" title="Zavřít">✕</button></h2>
    <div id="convs"></div>
  </div>
</div>
<div id="log"><p class="empty">No? Tak co chceš?</p></div>
<form id="f">
  <button id="mic" type="button" title="Mluvit (podrž si myšlenky)">🎙</button>
  <textarea id="q" rows="1" placeholder="Napiš mu něco…" autofocus></textarea>
  <button id="send" type="submit">Poslat</button>
</form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'),
      send = document.getElementById('send'), form = document.getElementById('f');

// Conversations live on the server per Authelia user, so the same chat shows up on every device.
let cid = null;

function bubble(cls, text) {
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text || '';
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

// 👍/👎 under each of his replies; logged server-side for persona tuning.
function addRating(el, id, rating) {
  if (!id) return;
  const bar = document.createElement('div'); bar.className = 'rate';
  for (const [val, label, title] of [[1, '👍', 'Tohle sedí'], [-1, '👎', 'Tohle by Ten druhý neřekl']]) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.title = title;
    if (rating === val) b.classList.add('on');
    b.onclick = async () => {
      const next = b.classList.contains('on') ? 0 : val;
      bar.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      if (next) b.classList.add('on');
      fetch('api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ message_id: id, rating: next }) }).catch(() => {});
    };
    bar.appendChild(b);
  }
  el.after(bar);
}

async function loadState() {
  try {
    const r = await fetch('api/state' + (cid ? '?conversation_id=' + encodeURIComponent(cid) : ''));
    if (!r.ok) return;
    const st = await r.json();
    cid = st.conversation_id;
    if (st.messages.length) {
      log.innerHTML = '';
      for (const m of st.messages) {
        const el = bubble(m.role === 'user' ? 'me' : 'him', m.content);
        if (m.role === 'assistant') addRating(el, m.id, m.rating);
      }
    }
  } catch (e) {}
}
loadState();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

const drawer = document.getElementById('drawer'), convs = document.getElementById('convs');

function when(ts) {
  const d = new Date(ts.replace(' ', 'T') + 'Z'), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}

async function openHistory() {
  drawer.classList.add('open'); convs.innerHTML = '<p class="empty" style="margin-top:2em">…</p>';
  let list = [];
  try { list = await (await fetch('api/conversations')).json(); } catch (e) {}
  convs.innerHTML = list.length ? '' : '<p class="empty" style="margin-top:2em">Zatím nic. Jsi docela nudnej.</p>';
  for (const c of list) {
    const row = document.createElement('div'); row.className = 'conv' + (c.id === cid ? ' cur' : '');
    const t = document.createElement('div'); t.className = 't';
    const b = document.createElement('b'); b.textContent = c.title || c.preview || '(bez názvu)';
    const sm = document.createElement('small'); sm.textContent = when(c.updated);
    t.append(b, sm);
    const del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = 'smazat';
    del.onclick = async ev => {
      ev.stopPropagation();
      if (!del.classList.contains('arm')) { del.classList.add('arm'); del.textContent = 'fakt?'; return; }
      await fetch('api/conversations/' + c.id, { method: 'DELETE' }).catch(() => {});
      row.remove();
      if (c.id === cid) { cid = null; log.innerHTML = '<p class="empty">Smazáno. Jako by se to nikdy nestalo.</p>'; }
    };
    row.onclick = async () => { cid = c.id; closeHistory(); log.innerHTML = ''; await loadState(); };
    row.append(t, del); convs.appendChild(row);
  }
}
function closeHistory() { drawer.classList.remove('open'); }
document.getElementById('hist').onclick = openHistory;
document.getElementById('close').onclick = closeHistory;
drawer.querySelector('.shade').onclick = closeHistory;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHistory(); });

document.getElementById('reset').onclick = () => {
  cid = null;  // the next message creates a new conversation server-side
  log.innerHTML = '<p class="empty">Zase od začátku. Fajn.</p>';
  q.focus();
};

// ---- Voice (browser-only: Web Speech API, no extra API quota) ----
const synth = window.speechSynthesis;
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const ttsBtn = document.getElementById('tts'), mic = document.getElementById('mic');
let ttsOn = false, dictated = false, voice = null;
try { ttsOn = localStorage.getItem('td_tts') === '1'; } catch (e) {}

function pickVoice() {
  if (!synth) return;
  const cs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('cs'));
  // Prefer a male-ish / higher quality Czech voice when the platform has several.
  voice = cs.find(v => /premium|enhanced|natural/i.test(v.name)) || cs.find(v => /google/i.test(v.name)) || cs[0] || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; } else { ttsBtn.style.display = 'none'; }

function renderTts() { ttsBtn.textContent = ttsOn ? '🔊' : '🔈'; ttsBtn.classList.toggle('on', ttsOn); }
renderTts();
ttsBtn.onclick = () => {
  ttsOn = !ttsOn; renderTts();
  try { localStorage.setItem('td_tts', ttsOn ? '1' : '0'); } catch (e) {}
  if (!ttsOn && synth) synth.cancel();
};

function speak(text) {
  if (!synth || !text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'cs-CZ'; if (voice) u.voice = voice;
  u.rate = 1.05; u.pitch = 0.8;  // a bit lower and drier
  synth.speak(u);
}

if (Recognition) {
  mic.style.display = 'block';
  let rec = null, finalText = '';
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }  // second tap: stop and send
    if (synth) synth.cancel();
    rec = new Recognition();
    rec.lang = 'cs-CZ'; rec.interimResults = true; rec.continuous = false;
    finalText = ''; mic.classList.add('on'); q.placeholder = 'Poslouchám…';
    rec.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript; else interim += ev.results[i][0].transcript;
      }
      q.value = (finalText + interim).trim(); q.dispatchEvent(new Event('input'));
    };
    rec.onerror = ev => { if (ev.error === 'not-allowed') q.placeholder = 'Mikrofon je zakázaný.'; };
    rec.onend = () => {
      rec = null; mic.classList.remove('on'); q.placeholder = 'Napiš mu něco…';
      if (q.value.trim()) { dictated = true; form.requestSubmit(); }
    };
    rec.start();
  };
}

form.onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text || send.disabled) return;
  // Spoken question -> spoken answer, even with the speaker toggle off.
  const speakReply = ttsOn || dictated; dictated = false;
  if (synth) { synth.cancel(); if (speakReply) synth.speak(new SpeechSynthesisUtterance(''));  /* unlocks iOS audio within the gesture */ }
  q.value = ''; q.style.height = 'auto'; send.disabled = true;
  bubble('me', text);
  const him = bubble('him', '…'); let got = '';
  try {
    const r = await fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ conversation_id: cid, message: text }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.conversation_id) cid = ev.conversation_id;
        if (ev.t) { got += ev.t; him.textContent = got; log.scrollTop = log.scrollHeight; }
        if (ev.error) { const s = document.createElement('span'); s.className = 'err'; s.textContent = (got ? '\n' : '') + ev.error;
                        if (!got) him.textContent = ''; him.appendChild(s); }
        if (ev.done && ev.sources && ev.sources.length) { const s = document.createElement('span'); s.className = 'src';
                        s.textContent = 'vzpomínky z: ' + ev.sources.join(', '); him.appendChild(s); }
        if (ev.done) { addRating(him, ev.message_id, null); if (speakReply) speak(got); }
      }
    }
  } catch (err) {
    him.textContent = ''; const s = document.createElement('span'); s.className = 'err'; s.textContent = 'Spojení selhalo: ' + err.message; him.appendChild(s);
  }
  send.disabled = false; q.focus();
};
</script>
</body>
</html>
